<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Set 0.1</title><link rel="stylesheet" href="/renderer/style.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"}}</script></head><body>
<header><div><strong>VIRTUAL SET</strong><small>Spatial previsualization · prototype 0.1</small></div><div class="actions"><button id="newScene">New Scene</button><button id="openScene">Open</button><button class="primary" id="saveScene">Save Scene</button><button id="exportFrames">Export Frames</button><button class="primary" id="exportVideo">Export MP4</button></div></header>
<main><aside class="left"><h2>Scene</h2><label>Name<input id="sceneName" value="Experimental Room 6x5"></label><div class="row"><label>Width (m)<input id="roomW" type="number" min="2" max="30" step="0.5" value="6"></label><label>Depth (m)<input id="roomD" type="number" min="2" max="30" step="0.5" value="5"></label></div><label>Height (m)<input id="roomH" type="number" min="2" max="12" step="0.5" value="3"></label><label class="room-toggle"><input id="openSouth" type="checkbox" checked> Hide south wall to preview the interior</label><h2>Surfaces</h2><div id="surfaces"></div><h2>Library</h2><div class="grid"><button data-add="table">＋ Table</button><button data-add="sofa">＋ Sofa</button><button data-add="chair">＋ Chair</button><button data-add="door">＋ Door</button><button data-add="window">＋ Window</button><button data-add="mannequin">＋ Mannequin</button><button data-add="box">＋ Cube</button><label class="fileBtn">＋ GLB/glTF Model<input id="modelFile" type="file" accept=".glb,.gltf" hidden></label></div><h2>Selection</h2><div id="objectList"></div><div id="inspector"></div></aside>
<section class="center"><div class="viewport" id="viewport"></div><div class="transport"><button id="frameRoom">Frame Room</button><button id="addKey">◆ Keyframe</button><button id="play">▶ Play</button><label>FPS <input id="fps" type="number" value="12" min="1" max="30"></label><label>Output <select id="resolution"><option value="640x360">640 × 360</option><option value="960x540">960 × 540</option><option value="1280x720">1280 × 720</option></select></label><span id="status">Scene ready</span></div><div class="timeline"><div class="ruler" id="ruler"></div><div class="tracks"><div>Camera</div><div>Characters</div><div>Objects</div></div><input id="time" type="range" min="0" max="100" value="0"><div class="timecode"><span id="timeLabel">00:00.00</span><span>Drag to scrub · smooth interpolation</span></div></div></section>
<aside class="right"><h2>Virtual Camera</h2><div class="row"><label>X<input id="camX" type="number" step="0.1" value="0"></label><label>Y<input id="camY" type="number" step="0.1" value="2.2"></label><label>Z<input id="camZ" type="number" step="0.1" value="7"></label></div><div class="row"><label>Target X<input id="targetX" type="number" step="0.1" value="0"></label><label>Y<input id="targetY" type="number" step="0.1" value="1"></label><label>Target Z<input id="targetZ" type="number" step="0.1" value="0"></label></div><label>Focal Length <output id="focalOut">28 mm</output><input id="focal" type="range" min="18" max="85" value="28"></label><label>Exposure <output id="exposureOut">1.0</output><input id="exposure" type="range" min="0.3" max="2.5" step="0.1" value="1"></label><h2>Shot Presets</h2><button class="wide" data-shot="wide">＋ Wide Shot</button><button class="wide" data-shot="medium">＋ Medium Shot</button><button class="wide" data-shot="close">＋ Close-up</button><h2>Lighting</h2><label>Intensity <input id="lightPower" type="range" min="0.2" max="3" step="0.1" value="1.4"></label><label>Color <input id="lightColor" type="color" value="#fff0d6"></label><label>Orbit Duration (seconds)<input id="orbitDuration" type="number" value="8" min="2" max="60"></label><button class="wide" id="orbit">Create Orbit</button><button class="wide" id="walk">Animate Character</button></aside></main><script type="module">import * as THREE from "/vendor/three.module.js"; window.THREE=THREE; const {OrbitControls}=await import("/vendor/OrbitControls.js"); const {TransformControls}=await import("/vendor/TransformControls.js"); const {GLTFLoader}=await import("/vendor/GLTFLoader.js"); const {GLTFExporter}=await import("/vendor/GLTFExporter.js"); window.OrbitControls=OrbitControls; window.TransformControls=TransformControls; window.GLTFLoader=GLTFLoader; window.GLTFExporter=GLTFExporter; await import("/renderer/app.js");</script></body></html>
