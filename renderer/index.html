<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Set 0.1</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"}}</script></head><body>
<header><div><strong>VIRTUAL SET</strong><small>Realização espacial · protótipo 0.1</small></div><div class="actions"><button id="newScene">Nova cena</button><button id="openScene">Abrir</button><button class="primary" id="saveScene">Guardar cena</button><button id="exportFrames">Exportar fotogramas</button><button class="primary" id="exportVideo">Exportar MP4</button></div></header>
<main><aside class="left"><h2>Cena</h2><label>Nome<input id="sceneName" value="Sala experimental 6x5"></label><div class="row"><label>Largura (m)<input id="roomW" type="number" min="2" max="30" step="0.5" value="6"></label><label>Profundidade (m)<input id="roomD" type="number" min="2" max="30" step="0.5" value="5"></label></div><label>Altura (m)<input id="roomH" type="number" min="2" max="12" step="0.5" value="3"></label><h2>Superfícies</h2><div id="surfaces"></div><h2>Biblioteca</h2><div class="grid"><button data-add="table">＋ Mesa</button><button data-add="sofa">＋ Sofá</button><button data-add="chair">＋ Cadeira</button><button data-add="door">＋ Porta</button><button data-add="window">＋ Janela</button><button data-add="mannequin">＋ Manequim</button><button data-add="box">＋ Cubo</button><label class="fileBtn">＋ Modelo GLB (pendente)<input id="modelFile" type="file" accept=".glb,.gltf" hidden disabled></label></div><h2>Seleção</h2><div id="objectList"></div><div id="inspector"></div></aside>
<section class="center"><div class="viewport" id="viewport"></div><div class="transport"><button id="frameRoom">Enquadrar sala</button><button id="addKey">◆ Keyframe</button><button id="play">▶ Reproduzir</button><label>FPS <input id="fps" type="number" value="12" min="1" max="30"></label><label>Saída <select id="resolution"><option value="640x360">640 × 360</option><option value="960x540">960 × 540</option><option value="1280x720">1280 × 720</option></select></label><span id="status">Cena pronta</span></div><div class="timeline"><div class="ruler" id="ruler"></div><div class="tracks"><div>Câmara</div><div>Personagens</div><div>Objetos</div></div><input id="time" type="range" min="0" max="100" value="0"><div class="timecode"><span id="timeLabel">00:00.00</span><span>Arraste para navegar · interpolação suave</span></div></div></section>
<aside class="right"><h2>Câmara virtual</h2><div class="row"><label>X<input id="camX" type="number" step="0.1" value="0"></label><label>Y<input id="camY" type="number" step="0.1" value="2.2"></label><label>Z<input id="camZ" type="number" step="0.1" value="7"></label></div><div class="row"><label>Alvo X<input id="targetX" type="number" step="0.1" value="0"></label><label>Y<input id="targetY" type="number" step="0.1" value="1"></label><label>Z<input id="targetZ" type="number" step="0.1" value="0"></label></div><label>Distância focal <output id="focalOut">35 mm</output><input id="focal" type="range" min="18" max="85" value="35"></label><label>Exposição <output id="exposureOut">1.0</output><input id="exposure" type="range" min="0.3" max="2.5" step="0.1" value="1"></label><h2>Enquadramentos</h2><button class="wide" data-shot="wide">＋ Plano geral</button><button class="wide" data-shot="medium">＋ Plano médio</button><button class="wide" data-shot="close">＋ Plano próximo</button><h2>Luz</h2><label>Intensidade <input id="lightPower" type="range" min="0.2" max="3" step="0.1" value="1.4"></label><label>Temperatura <input id="lightColor" type="color" value="#fff0d6"></label><label>Trajetória orbital (segundos)<input id="orbitDuration" type="number" value="8" min="2" max="60"></label><button class="wide" id="orbit">Criar órbita</button><button class="wide" id="walk">Animar manequim</button></aside></main><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"}}</script><script type="module">import * as THREE from "/vendor/three.module.js"; window.THREE=THREE; const {OrbitControls}=await import("/vendor/OrbitControls.js"); const {TransformControls}=await import("/vendor/TransformControls.js"); const GLTFLoader=class {parse(){throw new Error("Importação GLTF ainda não disponível")}}; const GLTFExporter=class {}; window.OrbitControls=OrbitControls; window.TransformControls=TransformControls; window.GLTFLoader=GLTFLoader; window.GLTFExporter=GLTFExporter; await import("/renderer/app.js");</script></body></html>
